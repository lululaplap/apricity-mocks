<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Apricity Table Menu</title>
<meta name="apricity-menu" content="main">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="only light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600&display=swap">
<style>
/* Layout: a bare splash (wordmark + four menu links) leads to the menus: one sticky header (wordmark, four tabs, section chips) over a single peach column.
   Readability floor for older guests: no text under 14px, regular weight or heavier, contrast of at least 6.7:1, tap targets of at least 44px.
   Colours follow the website: black text and greys, with the logo in black too.
   The website's lightest grey (#6A6A6A, 3.6:1) fails contrast, so a darker neutral grey stands in for it. */
:root {
  --page: #F9C6BA;          /* apricityrestaurant.com peach */
  --ink: #000000;           /* the website's black: 13.8:1 on peach */
  --mid: #3A3A3A;           /* the website's dark grey: 7.48:1 */
  --light: #414141;         /* in place of the website's #6A6A6A: 6.72:1 */
  --rule: rgba(0, 0, 0, 0.18);
  --rule-strong: rgba(0, 0, 0, 0.55);
  --font: "Josefin Sans", "Brandon Grotesque", "Futura", "Century Gothic", sans-serif;
  --tap: 44px;
  --brand: var(--ink);      /* the logo, in black like the text */
  /* Always the website's peach look: no dark mode, and browsers are asked not to auto-darken it. */
  color-scheme: only light;
}
/* The "Larger text" button scales everything, because every size is in rem. */
html.text-large { font-size: 115%; }
html.text-largest { font-size: 132%; }

* { box-sizing: border-box; }
body {
  background: var(--page); color: var(--ink);
  font-family: var(--font); font-weight: 400; font-size: 1.0625rem; line-height: 1.6;
  letter-spacing: 0.02em; -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--page);
}
button { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.caps { text-transform: uppercase; letter-spacing: 0.14em; font-weight: 400; }
.textsize {
  min-height: var(--tap); padding: 0 14px; border: 1px solid var(--rule-strong); border-radius: 999px;
  background: transparent; cursor: pointer; font-size: 0.875rem; white-space: nowrap;
}

/* ---------- header ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--page); border-bottom: 1px solid var(--rule-strong); }
.brandrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 8px 0; }
.wordmark { min-height: var(--tap); background: none; border: 0; padding: 0; cursor: pointer; display: flex; align-items: center; }
/* The logo is a 1.8KB vector traced from the logo pack and drawn once in the page, so it adds no download and stays sharp at any text size. */
.logo { display: block; aspect-ratio: 5839 / 821; height: auto; fill: var(--brand); }
.wordmark .logo { width: 9.75rem; }

/* ---------- splash ---------- */
.splash {
  min-height: calc(100svh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  display: grid; align-content: center; gap: 40px; text-align: center; padding-block: 40px;
}
.splash h1 { margin: 0; display: flex; justify-content: center; }
.splash h1 .logo { width: min(17.5rem, 78vw); }
.links { display: grid; border-top: 1px solid var(--rule-strong); }
.links button {
  border: 0; border-bottom: 1px solid var(--rule-strong); background: none; padding: 20px 0 18px; cursor: pointer;
  font-size: 1.0625rem; text-transform: uppercase; letter-spacing: 0.2em; transition: background .2s, color .2s;
}
.links button:hover, .links button:active { background: var(--ink); color: var(--page); }
.splash .note { margin: 0; font-size: 1rem; }
.splash .textsize { justify-self: center; }

/* Drinks and food sit in two groups; with large text the food group wraps onto its own line. */
.tabs { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; column-gap: 28px; }
.tabs .group { display: flex; gap: 16px; }
.tab {
  border: 0; background: none; min-height: var(--tap); min-width: var(--tap); padding: 0; cursor: pointer;
  font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--mid);
  text-underline-offset: 7px;
}
.tab[aria-current="page"] { color: var(--ink); font-weight: 600; text-decoration: underline; text-decoration-thickness: 2px; }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-block: 4px 12px; }
.chips::-webkit-scrollbar { display: none; }
/* A fade on the right edge shows there are more sections to scroll to. */
.chips.more { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 48px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 48px), transparent); }
.chips.less { -webkit-mask-image: linear-gradient(to right, transparent, #000 28px); mask-image: linear-gradient(to right, transparent, #000 28px); }
.chips.less.more { -webkit-mask-image: linear-gradient(to right, transparent, #000 28px, #000 calc(100% - 48px), transparent); mask-image: linear-gradient(to right, transparent, #000 28px, #000 calc(100% - 48px), transparent); }
.chip {
  flex: none; min-height: var(--tap); border: 1px solid var(--rule-strong); background: transparent; border-radius: 999px;
  padding: 2px 16px 0; font-size: 0.875rem; cursor: pointer; color: var(--ink);
  white-space: nowrap; text-transform: uppercase; letter-spacing: 0.08em;
}
.chip.active, .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--page); }
/* Wine: "Bottles" opens into a button per style, which slide out one after another. */
.chip { overflow: hidden; }
.chip.parent[aria-expanded="true"]:not(.active) { border-color: var(--ink); font-weight: 600; }
.chip .chev {
  display: inline-block; width: 0.45em; height: 0.45em; margin-left: 0.55em; vertical-align: 0.15em;
  border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
  transform: rotate(-45deg); transition: transform 0.3s ease;
}
.chip.parent[aria-expanded="true"] .chev { transform: rotate(45deg); }
.chips.opening::after { content: ""; flex: none; width: 100%; }
.chip.sub {
  max-width: 0; padding-left: 0; padding-right: 0; border-width: 0; margin-left: -8px; opacity: 0; visibility: hidden;
  transition: max-width 0.25s ease, padding 0.25s ease, margin 0.25s ease, border-width 0s 0.25s, opacity 0.12s ease, visibility 0s 0.25s;
}
.chips.open .chip.sub {
  max-width: 16rem; padding-left: 16px; padding-right: 16px; border-width: 1px; margin-left: 0; opacity: 1; visibility: visible;
  transition: max-width 0.4s cubic-bezier(0.2, 0.7, 0.2, 1) var(--d), padding 0.4s cubic-bezier(0.2, 0.7, 0.2, 1) var(--d),
    margin 0.4s cubic-bezier(0.2, 0.7, 0.2, 1) var(--d), border-width 0s var(--d), opacity 0.3s ease calc(var(--d) + 80ms), visibility 0s var(--d);
}
.chips .sep { flex: none; width: 1px; background: var(--rule-strong); margin: 8px 2px; }
/* Plant-based, while on: pinned to the left so the other buttons slide underneath it. The shadow hides them in the gap. */
.chip#plant[aria-pressed="true"] { position: sticky; left: 0; z-index: 1; box-shadow: 12px 0 0 var(--page), 22px 0 10px var(--page), -8px 0 0 var(--page); }

/* ---------- lists ---------- */
main { padding-block: 4px 8px; }
main:focus { outline: none; }
.note { color: var(--light); font-size: 0.9375rem; margin: 16px 0 0; }
.keylink { display: inline-block; background: none; border: 0; padding: 0; min-height: var(--tap); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; color: var(--ink); }
.section { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 160px); padding-top: 28px; }
.section h2 {
  font-size: 0.9375rem; margin: 0; padding-bottom: 8px; border-bottom: 1px solid var(--rule-strong);
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px;
}
.section h2 small { font-size: 0.875rem; color: var(--light); letter-spacing: 0.08em; }
.section h3 { font-size: 0.875rem; color: var(--light); margin: 18px 0 0; }
.group-title { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 160px); font-size: 1.25rem; text-align: center; letter-spacing: 0.24em; margin: 44px 0 0; }
.items { list-style: none; margin: 0; padding: 0; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 20px; padding: 14px 0; border-bottom: 1px solid var(--rule); }
.item:last-child { border-bottom: 0; }
.item .name { min-width: 0; font-weight: 600; }
.item .desc { grid-column: 1; color: var(--mid); font-size: 0.9375rem; margin: 0; }
.price { grid-column: 2; grid-row: 1 / span 2; align-self: start; white-space: nowrap; text-align: right; font-weight: 600; font-variant-numeric: lining-nums; }
.price small { display: block; color: var(--light); font-size: 0.875rem; font-weight: 400; }
.codes { font-size: 0.875rem; color: var(--light); letter-spacing: 0.06em; white-space: nowrap; font-weight: 400; }
.codes b { color: var(--ink); font-weight: 600; }
.vin, .cuv { color: var(--mid); font-weight: 400; }
.notice { margin-top: 22px; padding: 16px 18px; border: 1px solid var(--ink); display: grid; gap: 8px; }
.notice p { margin: 0; }
.notice-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
.notice .name { font-weight: 600; }
.notice .price { font-weight: 600; white-space: nowrap; }
.notice .price small { font-weight: 400; color: var(--mid); font-size: 0.875rem; }
.notice .desc { color: var(--mid); font-size: 0.9375rem; }
.empty { color: var(--mid); padding: 14px 0; margin: 0; font-size: 1rem; }

/* chefs' table */
.event { display: grid; gap: 8px; }
.event p { margin: 0; }
.event-welcome { font-size: 0.9375rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mid); }
.event-date { color: var(--mid); }
.event-message, .event-inline { font-size: 1.375rem; font-weight: 600; letter-spacing: 0.04em; text-wrap: balance; }
.event-message:empty, .event-date:empty { display: none; }
.event-inline { margin: 20px 0 0; text-align: center; }
.courses { list-style: none; margin: 0; padding: 0; counter-reset: course; }
.courses li { counter-increment: course; display: grid; grid-template-columns: 2.25rem minmax(0, 1fr); padding: 14px 0; border-bottom: 1px solid var(--rule); font-weight: 600; }
.courses li:last-child { border-bottom: 0; }
.courses li::before { content: counter(course); color: var(--light); font-weight: 400; }
.courses .desc { margin: 2px 0 0; color: var(--mid); font-size: 0.9375rem; font-weight: 400; }

/* tasting */
.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(6.5rem, 1fr)); margin-top: 20px; border: 1px solid var(--rule-strong); }
.seg button { border: 0; background: transparent; padding: 14px 6px 12px; cursor: pointer; display: grid; gap: 4px; }
.seg button + button { border-left: 1px solid var(--rule-strong); }
.seg .big { font-size: 1.5rem; font-weight: 600; }
.seg small { font-size: 0.875rem; color: var(--mid); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--page); }
.seg button[aria-pressed="true"] small { color: var(--page); }
.choose { margin: 16px 0 0; font-size: 1.125rem; font-weight: 600; }
.opts { list-style: none; margin: 0; padding: 0; }
.extra {
  display: inline-block; margin-left: 8px; padding: 3px 10px 1px; border: 1px solid var(--ink); border-radius: 999px;
  color: var(--ink); font-size: 0.875rem; letter-spacing: 0.08em; white-space: nowrap; vertical-align: 0.05em;
}
.opts li { padding: 12px 0; font-weight: 600; }
.opts li + li { padding-top: 4px; }
.opts .or {
  display: flex; align-items: center; gap: 14px; margin-bottom: 12px;
  font-size: 0.875rem; font-weight: 400; letter-spacing: 0.16em; text-transform: uppercase; color: var(--light);
}
.opts .or::before, .opts .or::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.opts .desc { display: block; color: var(--mid); font-size: 0.9375rem; font-weight: 400; }

/* cross-link between drinks and food */
.next {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%;
  margin-top: 36px; padding: 18px 20px; cursor: pointer; min-height: 56px;
  border: 1px solid var(--ink); background: transparent; text-align: left;
}
.next span { font-size: 0.9375rem; }
.next:hover, .next:active { background: var(--ink); color: var(--page); }

/* footer */
.foot { padding-block: 28px 32px; color: var(--light); font-size: 0.875rem; display: grid; gap: 12px; text-align: center; }
.foot p { margin: 0; }
.foot .fine-print { text-align: left; line-height: 1.65; }
.foot .fine-print strong { color: var(--ink); font-weight: 600; }
.foot .fine-print a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; padding-block: 14px; margin-block: -14px; } /* a 44px-tall tap area without moving the text */
.foot .textsize { justify-self: center; }
details { text-align: left; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 160px); }
summary { cursor: pointer; text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.875rem; color: var(--ink); min-height: var(--tap); display: flex; align-items: center; }
details p { margin: 0 0 12px; color: var(--mid); }
details dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 4px 0 12px; color: var(--mid); }
details dt { font-weight: 600; color: var(--ink); }
details dd { margin: 0; }

.status { padding-block: 48px; text-align: center; color: var(--mid); }
.status .next { justify-content: center; margin-top: 20px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="brandrow">
      <button class="wordmark" id="home" type="button" aria-label="Apricity, back to all menus"><svg class="logo" aria-hidden="true" focusable="false"><use href="#apricity-logo"/></svg></button>
    </div>
    <nav class="tabs" aria-label="Menus">
      <div class="group">
        <button class="tab" data-view="chefs" data-mode="chefs" type="button">Chefs’ table</button>
        <button class="tab" data-view="drinks" type="button">Drinks</button>
        <button class="tab" data-view="wine" type="button">Wine</button>
      </div>
      <div class="group">
        <button class="tab" data-view="alacarte" data-mode="main" type="button">A la carte</button>
        <button class="tab" data-view="tasting" data-mode="main" type="button">Tasting</button>
      </div>
    </nav>
    <div class="chips" id="chips" role="group" aria-label="Jump to a section"></div>
  </div>
</header>

<main class="splash wrap" id="splash" hidden>
  <h1><svg class="logo" role="img" aria-label="Apricity"><use href="#apricity-logo"/></svg></h1>
  <div class="event" data-mode="chefs">
    <p class="event-welcome" id="event-welcome">Chefs’ table</p>
    <p class="event-date" id="event-date"></p>
    <p class="event-message" id="event-message"></p>
  </div>
  <nav class="links" aria-label="Menus" data-mode="chefs">
    <button type="button" data-view="chefs">Tonight’s menu</button>
    <button type="button" data-view="drinks">Drinks</button>
    <button type="button" data-view="wine">Wine list</button>
  </nav>
  <nav class="links" aria-label="Menus" data-mode="main">
    <button type="button" data-view="drinks">Drinks</button>
    <button type="button" data-view="wine">Wine list</button>
    <button type="button" data-view="alacarte">A la carte</button>
    <button type="button" data-view="tasting" data-courses="5">Tasting menus</button>
    <button type="button" data-view="tasting" data-courses="kids">Kids’ menu</button>
  </nav>
  <p class="note">Allergies? Please tell your server before ordering.</p>
  <button class="textsize" type="button" data-textsize>Larger text</button>
</main>

<main class="wrap" id="body" tabindex="-1"></main>
<footer class="wrap foot" id="foot"></footer>
<p class="sr-only" id="announce" aria-live="polite"></p>
<script>
(function () {
  // ---------- where the menus come from ----------
  // Each menu is one tab of the "Apricity menus" Google Sheet. These are the copies in sheets/, used by the
  // preview and local testing; build.sh points the live pages at the published sheet (set the links there).
  var SHEETS = {
    drinks: "sheets/drinks.csv",
    alacarte: "sheets/alacarte.csv",
    tasting: "sheets/tasting.csv",
    tastingPrices: "sheets/tasting-prices.csv",
    kids: "sheets/kids.csv",
    chefs: "sheets/chefs-table.csv",
    chefsDetails: "sheets/chefs-table-details.csv",
    // The restaurant's existing apricity_wines sheet.
    wine: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSH5PMPgMOSJTzJ3FnKJmZxY3lI0loTNugZsmD6_U7PeT4LHiYJY75BtW-mFIgpeVbuDoZ8x724M6i1/pub?gid=652214147&single=true&output=csv"
  };
  var NEEDS = { drinks: ["drinks"], wine: ["wine"], alacarte: ["alacarte"], tasting: ["tasting", "tastingPrices", "kids"], chefs: ["chefs", "chefsDetails"] };

  var CODES = { "V": "Vegetarian", "P-B": "Plant-based", "C": "Crustaceans", "Ce": "Celery", "D": "Dairy", "E": "Eggs", "F": "Fish", "P": "Peanuts",
    "G": "Gluten", "L": "Lupin", "N": "Nuts", "Mo": "Molluscs", "Mu": "Mustard", "S": "Soya", "SD": "Sulphur dioxide", "Se": "Sesame", "A": "Alcohol" };
  var TRACES = "We prepare our food in an environment with allergens and can’t guarantee that a dish is completely free of any allergen as traces may remain.";
  var ALLERGENS = '<details id="key"><summary>What the allergen codes mean</summary><dl>' +

  function setOpen(open) {
    var parent = chips.querySelector(".chip.parent");
    if (!parent || chips.classList.contains("open") === open) return;
    chips.classList.toggle("open", open);
    parent.setAttribute("aria-expanded", open);
    // Opening: move Bottles to the left edge so the styles slide out into view beside it. A temporary spacer gives
    // the row room to scroll before the styles have grown.
    if (open) {
      chips.classList.add("opening");
      chips.scrollLeft += parent.getBoundingClientRect().left - chips.getBoundingClientRect().left - leftEdge();
    }
    chips.querySelectorAll(".chip.sub").forEach(function (c) {
      if (open) { c.removeAttribute("tabindex"); c.removeAttribute("aria-hidden"); } else { c.setAttribute("tabindex", "-1"); c.setAttribute("aria-hidden", "true"); }
    });
    // Once the buttons have finished opening or closing, keep the highlighted one in view.
    clearTimeout(revealTimer);
    revealTimer = setTimeout(function () { chips.classList.remove("opening"); reveal(chips.querySelector(".chip.active")); updateFade(); }, 800);
  }

  // ---------- jumping to a section ----------
  var jumping = null, jumpTimer;
  function jump(id) {
    var s = document.getElementById("sec-" + id);
    if (!s) return;
    jumping = id;
    setActive(id);
    var start = s.getBoundingClientRect().top, distance = start - top.offsetHeight + 1;
    var smooth = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    window.scrollTo({ top: Math.max(0, window.pageYOffset + distance), behavior: smooth ? "smooth" : "auto" });
    // Where the window itself doesn't scroll (some embedded viewers), scroll whatever contains the page instead.
    setTimeout(function () {
      if (Math.abs(distance) > 2 && Math.abs(s.getBoundingClientRect().top - start) < 2) s.scrollIntoView({ block: "start" });
    }, 150);
    clearTimeout(jumpTimer);
    jumpTimer = setTimeout(function () { jumping = null; }, 1000);
  }

  function courseChoice(t) { return t.dataset.courses === "kids" ? "kids" : +t.dataset.courses; }

  // ---------- events ----------
  document.addEventListener("click", function (e) {
    var t = e.target.closest("button");
    if (!t) return;
    if (t.id === "home") return show("home", true);
    if (t.hasAttribute("data-retry")) return show(state.view);
    if (t.dataset.view) {
      if (t.dataset.courses) state.courses = courseChoice(t);
      if (t.dataset.view !== state.view) show(t.dataset.view, true); else window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
    if (t.dataset.jump) return jump(t.dataset.jump);
    if (t.id === "plant") {
      state.plantOnly = !state.plantOnly;
      try { localStorage.setItem("apricity-menu", JSON.stringify({ plantOnly: state.plantOnly })); } catch (err) {}
      // Keep the button under the guest's finger: back to the start of the row, where it's visible on or off.
      return rerender().then(function () { chips.scrollLeft = 0; updateFade(); });
    }
    if (t.dataset.courses) { state.courses = courseChoice(t); return rerender(); }
    if (t.hasAttribute("data-key")) {
      var key = document.getElementById("key");
      if (key) { key.open = true; key.scrollIntoView({ block: "start" }); key.querySelector("summary").focus({ preventScroll: true }); }
      return;
    }
    if (t.hasAttribute("data-textsize")) {
      size = (size + 1) % SIZES.length;
      try { localStorage.setItem("apricity-text", SIZES[size]); } catch (err) {}
      applySize();
      $("#announce").textContent = ["Normal text size", "Large text", "Largest text"][size];
    }
  });

  // ---------- text size ----------
  // Three steps: normal, large (115%) and largest (132%). The button names the next step and the phone remembers the choice.
  var SIZES = ["", "text-large", "text-largest"], LABELS = ["Larger text", "Largest text", "Normal text"], size = 0;
  try { size = Math.max(0, SIZES.indexOf(localStorage.getItem("apricity-text") || "")); } catch (e) {}
  function applySize() {
    SIZES.forEach(function (c) { if (c) document.documentElement.classList.toggle(c, c === SIZES[size]); });
    document.querySelectorAll("[data-textsize]").forEach(function (b) { b.textContent = LABELS[size]; });
    updateFade();
  }
  applySize();
  window.addEventListener("popstate", function () { show(location.hash.slice(1)); });

  show(location.hash.slice(1));
})();
</script>

</body>
