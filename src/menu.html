<style>
/* Layout: opens straight on drinks. One sticky header (wordmark, four menu tabs, section chips) over a single peach column. */
:root {
  --page: #F9C6BA;          /* apricityrestaurant.com peach */
  --ink: #000000;
  --mid: #3A3A3A;
  --light: #5F5A59;
  --rule: rgba(0, 0, 0, 0.14);
  --rule-strong: rgba(0, 0, 0, 0.5);
  --font: "Josefin Sans", "Brandon Grotesque", "Futura", "Century Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #2B1F1D; --ink: #F9C6BA; --mid: #E2B5AA; --light: #B0918A;
    --rule: rgba(249, 198, 186, 0.15); --rule-strong: rgba(249, 198, 186, 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #2B1F1D; --ink: #F9C6BA; --mid: #E2B5AA; --light: #B0918A;
  --rule: rgba(249, 198, 186, 0.15); --rule-strong: rgba(249, 198, 186, 0.45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--page); color: var(--ink);
  font-family: var(--font); font-weight: 300; font-size: 1rem; line-height: 1.55;
  letter-spacing: 0.03em; -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--page);
}
button { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.caps { text-transform: uppercase; letter-spacing: 0.18em; font-weight: 400; }

/* ---------- header ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--page); border-bottom: 1px solid var(--rule-strong); }
.brandrow { display: flex; align-items: baseline; justify-content: space-between; padding-block: 14px 4px; }
.wordmark { font-weight: 300; font-size: 1.375rem; letter-spacing: 0.3em; line-height: 1; }
.table { font-size: 0.6875rem; color: var(--light); }

.tabs { display: flex; align-items: center; justify-content: space-between; padding-block: 10px 8px; }
.tabs .group { display: flex; gap: 18px; }
.tabs .divider { width: 1px; height: 14px; background: var(--rule-strong); }
.tab {
  border: 0; background: none; padding: 6px 0; cursor: pointer;
  font-size: 0.8125rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--mid);
  text-underline-offset: 6px;
}
.tab[aria-selected="true"] { color: var(--ink); font-weight: 600; text-decoration: underline; text-decoration-thickness: 1px; }

.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-block: 2px 12px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--rule-strong); background: transparent; border-radius: 999px;
  padding: 6px 12px 4px; font-size: 0.6875rem; cursor: pointer; color: var(--mid);
  white-space: nowrap; text-transform: uppercase; letter-spacing: 0.12em;
}
.chip.active, .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--page); }
.chips .sep { flex: none; width: 1px; background: var(--rule-strong); margin: 4px 2px; }

/* ---------- lists ---------- */
main { padding-block: 4px 8px; }
.note { color: var(--light); font-size: 0.8125rem; margin: 16px 0 0; }
.section { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 140px); padding-top: 26px; }
.section h2 {
  font-size: 0.8125rem; margin: 0; padding-bottom: 8px; border-bottom: 1px solid var(--rule-strong);
  display: flex; justify-content: space-between; gap: 12px;
}
.section h2 small { font-size: 0.6875rem; color: var(--light); letter-spacing: 0.12em; }
.section h3 { font-size: 0.6875rem; color: var(--light); margin: 16px 0 0; }
.group-title { font-size: 1.125rem; text-align: center; letter-spacing: 0.24em; margin: 40px 0 0; }
.items { list-style: none; margin: 0; padding: 0; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 20px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.item:last-child { border-bottom: 0; }
.item .name { min-width: 0; font-weight: 400; }
.item .desc { grid-column: 1; color: var(--mid); font-size: 0.875rem; margin: 0; }
.price { grid-column: 2; grid-row: 1 / span 2; align-self: start; white-space: nowrap; text-align: right; font-weight: 400; font-variant-numeric: lining-nums; }
.price small { display: block; color: var(--light); font-size: 0.6875rem; font-weight: 300; }
.codes { font-size: 0.6875rem; color: var(--light); letter-spacing: 0.08em; white-space: nowrap; font-weight: 400; }
.codes b { color: var(--ink); font-weight: 600; }
.vin, .cuv { color: var(--mid); font-weight: 300; }
.empty { color: var(--mid); padding: 12px 0; margin: 0; font-size: 0.9375rem; }

/* tasting */
.seg { display: grid; grid-template-columns: 1fr 1fr; margin-top: 20px; border: 1px solid var(--rule-strong); }
.seg button { border: 0; background: transparent; padding: 12px 6px 10px; cursor: pointer; display: grid; gap: 2px; }
.seg button + button { border-left: 1px solid var(--rule-strong); }
.seg .big { font-size: 1.375rem; font-weight: 400; }
.seg small { font-size: 0.75rem; color: var(--mid); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--page); }
.seg button[aria-pressed="true"] small { color: var(--page); }
.opts { list-style: none; margin: 0; padding: 0; }
.opts li { padding: 12px 0; border-bottom: 1px solid var(--rule); font-weight: 400; }
.opts li:last-child { border-bottom: 0; }
.opts .desc { display: block; color: var(--mid); font-size: 0.875rem; font-weight: 300; }

/* cross-link between drinks and food */
.next {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%;
  margin-top: 36px; padding: 18px 20px; cursor: pointer;
  border: 1px solid var(--ink); background: transparent; text-align: left;
}
.next span { font-size: 0.8125rem; }
.next:hover, .next:active { background: var(--ink); color: var(--page); }

/* footer */
.foot { padding-block: 28px 32px; color: var(--light); font-size: 0.75rem; display: grid; gap: 10px; text-align: center; }
.foot p { margin: 0; }
details { text-align: left; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 10px 0; }
summary { cursor: pointer; text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.6875rem; color: var(--mid); }
details p { margin-top: 8px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

        next("alacarte", "Food menu", "A la carte & tasting");
      setChips(DRINKS.map(function (s) { return [s.id, s.t]; }));
      foot.innerHTML = "<p>Alcohol-free pairing for the tasting menu: 4 glasses £36 · 6 glasses £54</p>" + FOOT;
    },
    wine: function () {
      var html = '<p class="note">♢ Wines with unique expressions</p>', nav = [];
      WINES.forEach(function (g, gi) {
        if (gi === 0) {
          nav.push(["glass", "By the glass"]);
          html += section("glass", "By the glass", g.s.map(function (s) { return '<h3 class="caps">' + esc(s.t) + "</h3>" + list(s.w.map(wine)); }).join(""), "125ml");
        } else {
          html += '<h2 class="caps group-title">Bottles</h2>';
          g.s.forEach(function (s, i) {
            var id = "b" + i;
            nav.push([id, s.t.replace(/^(White|Red) — /, "$1: ").replace("Orange / Skin Contact", "Orange")]);
            html += section(id, s.t, list(s.w.map(wine)), i === 0 ? "750ml" : "");
          });
        }
      });
      body.innerHTML = html + next("alacarte", "Food menu", "A la carte & tasting");
      setChips(nav);
      foot.innerHTML = FOOT;
    },
    alacarte: function () {
      body.innerHTML = ALLERGY_NOTE + ALACARTE.map(function (s) {
        var items = plantFilter(s.items);
        return section(s.id, s.t, items.length ? list(items.map(item)) : '<p class="empty">No plant-based ' + s.t.toLowerCase() + " today.</p>");
      }).join("") + next("drinks", "Drinks", "Cocktails, wine & more");
      setChips(ALACARTE.map(function (s) { return [s.id, s.t]; }), true);
      foot.innerHTML = ALLERGENS + FOOT;
    },
    tasting: function () {
      var sel = TASTING.menus[state.courses];
      var html = '<div class="seg" role="group" aria-label="Number of courses">' + [5, 7].map(function (n) {
        var t = TASTING.menus[n];
        return '<button type="button" data-courses="' + n + '" aria-pressed="' + (state.courses === n) + '"><span class="caps">' + n +
          ' courses</span><span class="big">' + t.price + "</span><small>Lunch &amp; early evening " + t.special + "*</small></button>";
      }).join("") + '</div><p class="note">*Lunch &amp; pre-booked early dinner, groups up to 6. Choose one dish per course.</p>';

      var courses = "";
      TASTING.courses.forEach(function (c) {
        if (c.only7 && state.courses !== 7) {
          if (c.add5) courses += '<h3 class="caps">' + c.t + " · add " + c.add5 + "</h3>";
          return;
        }
        courses += '<h3 class="caps">' + c.t + '</h3><ul class="opts">';
        if (c.fixed) { courses += '<li><span class="desc">Served to everyone</span></li></ul>'; return; }
        courses += plantFilter(c.o).map(function (o) {
          return "<li>" + esc(o.n) + codes(o.c) + (o.s ? ' <span class="codes">' + o.s + "</span>" : "") + "</li>";
        }).join("") + "</ul>";
      });
      html += section("courses", state.courses + "-course menu", courses);
      html += section("pairings", "Pairings", list([item({ n: "Wine", p: sel.wine }), item({ n: "Alcohol-free", p: sel.na })]), sel.glasses);
      html += section("sides", "Add on the side", list(plantFilter([BREAD].concat(TASTING.sides)).map(item)));
      body.innerHTML = ALLERGY_NOTE + html + next("drinks", "Drinks", "Cocktails, wine & more");
      setChips([["courses", "Courses"], ["pairings", "Pairings"], ["sides", "Sides"]], true);
      foot.innerHTML = ALLERGENS + FOOT;
    }
  };

  function show(view, push) {
    if (VIEWS.indexOf(view) < 0) view = "drinks";
    state.view = view;
    document.querySelectorAll(".tab").forEach(function (b) { b.setAttribute("aria-selected", b.dataset.view === view); });
    render[view]();
    spy();
    if (push) { try { history.pushState(null, "", "#" + view); } catch (e) {} }
    window.scrollTo(0, 0);
  }
  function rerender() { var y = window.scrollY; show(state.view); window.scrollTo(0, y); }

  // ---------- section scroll-spy ----------
  var observer;
  function spy() {
    if (observer) observer.disconnect();
    if (!("IntersectionObserver" in window)) return;
    observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) setActive(e.target.dataset.sec); });
    }, { rootMargin: "-35% 0px -60% 0px" });
    body.querySelectorAll("[data-sec]").forEach(function (s) { observer.observe(s); });
    var first = body.querySelector("[data-sec]");
    if (first) setActive(first.dataset.sec);
  }
  function setActive(id) {
    chips.querySelectorAll("[data-jump]").forEach(function (c) {
      var on = c.dataset.jump === id;
      c.classList.toggle("active", on);
      if (on && (c.offsetLeft < chips.scrollLeft || c.offsetLeft + c.offsetWidth > chips.scrollLeft + chips.clientWidth)) {
        chips.scrollTo({ left: c.offsetLeft - 20, behavior: "smooth" });
      }
    });
  }

  // ---------- events ----------
  document.addEventListener("click", function (e) {
    var t = e.target.closest("button");
    if (!t) return;
    if (t.dataset.view) { if (t.dataset.view !== state.view) show(t.dataset.view, true); else window.scrollTo({ top: 0, behavior: "smooth" }); return; }
    if (t.dataset.jump) { var s = document.getElementById("sec-" + t.dataset.jump); if (s) s.scrollIntoView({ behavior: "smooth" }); setActive(t.dataset.jump); return; }
    if (t.id === "plant") {
      state.plantOnly = !state.plantOnly;
      try { localStorage.setItem("apricity-menu", JSON.stringify({ plantOnly: state.plantOnly })); } catch (err) {}
      return rerender();
    }
    if (t.dataset.courses) { state.courses = +t.dataset.courses; return rerender(); }
  });
  window.addEventListener("popstate", function () { show(location.hash.slice(1)); });

  show(location.hash.slice(1));
})();
</script>
