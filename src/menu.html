<title>Apricity Table Menu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap">
<style>
/* Layout: a bare splash (wordmark + four menu links) leads to the menus: one sticky header (wordmark, four tabs, section chips) over a single peach column. */
:root {
  --page: #F9C6BA;          /* apricityrestaurant.com peach */
  --ink: #000000;
  --mid: #3A3A3A;
  --light: #5F5A59;
  --rule: rgba(0, 0, 0, 0.14);
  --rule-strong: rgba(0, 0, 0, 0.5);
  --font: "Josefin Sans", "Brandon Grotesque", "Futura", "Century Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #2B1F1D; --ink: #F9C6BA; --mid: #E2B5AA; --light: #B0918A;
    --rule: rgba(249, 198, 186, 0.15); --rule-strong: rgba(249, 198, 186, 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #2B1F1D; --ink: #F9C6BA; --mid: #E2B5AA; --light: #B0918A;
  --rule: rgba(249, 198, 186, 0.15); --rule-strong: rgba(249, 198, 186, 0.45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--page); color: var(--ink);
  font-family: var(--font); font-weight: 300; font-size: 1rem; line-height: 1.55;
  letter-spacing: 0.03em; -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--page);
}
button { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.caps { text-transform: uppercase; letter-spacing: 0.18em; font-weight: 400; }

/* ---------- header ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--page); border-bottom: 1px solid var(--rule-strong); }
.brandrow { display: flex; align-items: baseline; justify-content: space-between; padding-block: 14px 4px; }
.wordmark { font-weight: 300; font-size: 1.375rem; letter-spacing: 0.3em; line-height: 1; background: none; border: 0; padding: 0; cursor: pointer; }

/* ---------- splash ---------- */
.splash {
  min-height: calc(100svh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  display: grid; align-content: center; gap: 44px; text-align: center; padding-block: 40px;
}
.splash h1 { margin: 0; font-weight: 300; font-size: 2.25rem; letter-spacing: 0.3em; margin-right: -0.3em; line-height: 1; }
.splash .table { display: block; margin-top: 14px; }
.links { display: grid; border-top: 1px solid var(--rule-strong); }
.links button {
  border: 0; border-bottom: 1px solid var(--rule-strong); background: none; padding: 20px 0 18px; cursor: pointer;
  font-size: 0.9375rem; text-transform: uppercase; letter-spacing: 0.22em; transition: background .2s, color .2s;
}
.links button:hover, .links button:active { background: var(--ink); color: var(--page); }
.splash .note { margin: 0; }
.table { font-size: 0.6875rem; color: var(--light); }

.tabs { display: flex; align-items: center; justify-content: space-between; padding-block: 10px 8px; }
.tabs .group { display: flex; gap: 18px; }
.tabs .divider { width: 1px; height: 14px; background: var(--rule-strong); }
.tab {
  border: 0; background: none; padding: 6px 0; cursor: pointer;
  font-size: 0.8125rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--mid);
  text-underline-offset: 6px;
}
.tab[aria-selected="true"] { color: var(--ink); font-weight: 600; text-decoration: underline; text-decoration-thickness: 1px; }

.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-block: 2px 12px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--rule-strong); background: transparent; border-radius: 999px;
  padding: 6px 12px 4px; font-size: 0.6875rem; cursor: pointer; color: var(--mid);
  white-space: nowrap; text-transform: uppercase; letter-spacing: 0.12em;
}
.chip.active, .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--page); }
.chips .sep { flex: none; width: 1px; background: var(--rule-strong); margin: 4px 2px; }

/* ---------- lists ---------- */
main { padding-block: 4px 8px; }
.note { color: var(--light); font-size: 0.8125rem; margin: 16px 0 0; }
.section { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 140px); padding-top: 26px; }
.section h2 {
  font-size: 0.8125rem; margin: 0; padding-bottom: 8px; border-bottom: 1px solid var(--rule-strong);
  display: flex; justify-content: space-between; gap: 12px;
}
.section h2 small { font-size: 0.6875rem; color: var(--light); letter-spacing: 0.12em; }
.section h3 { font-size: 0.6875rem; color: var(--light); margin: 16px 0 0; }
.group-title { font-size: 1.125rem; text-align: center; letter-spacing: 0.24em; margin: 40px 0 0; }
.items { list-style: none; margin: 0; padding: 0; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 20px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.item:last-child { border-bottom: 0; }
.item .name { min-width: 0; font-weight: 400; }
.item .desc { grid-column: 1; color: var(--mid); font-size: 0.875rem; margin: 0; }
.price { grid-column: 2; grid-row: 1 / span 2; align-self: start; white-space: nowrap; text-align: right; font-weight: 400; font-variant-numeric: lining-nums; }
.price small { display: block; color: var(--light); font-size: 0.6875rem; font-weight: 300; }
.codes { font-size: 0.6875rem; color: var(--light); letter-spacing: 0.08em; white-space: nowrap; font-weight: 400; }
.codes b { color: var(--ink); font-weight: 600; }
.vin, .cuv { color: var(--mid); font-weight: 300; }
.empty { color: var(--mid); padding: 12px 0; margin: 0; font-size: 0.9375rem; }

/* tasting */
.seg { display: grid; grid-template-columns: 1fr 1fr; margin-top: 20px; border: 1px solid var(--rule-strong); }
.seg button { border: 0; background: transparent; padding: 12px 6px 10px; cursor: pointer; display: grid; gap: 2px; }
.seg button + button { border-left: 1px solid var(--rule-strong); }
.seg .big { font-size: 1.375rem; font-weight: 400; }
.seg small { font-size: 0.75rem; color: var(--mid); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--page); }
.seg button[aria-pressed="true"] small { color: var(--page); }
.opts { list-style: none; margin: 0; padding: 0; }
.opts li { padding: 12px 0; border-bottom: 1px solid var(--rule); font-weight: 400; }
.opts li:last-child { border-bottom: 0; }
.opts .desc { display: block; color: var(--mid); font-size: 0.875rem; font-weight: 300; }

/* cross-link between drinks and food */
.next {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%;
  margin-top: 36px; padding: 18px 20px; cursor: pointer;
  border: 1px solid var(--ink); background: transparent; text-align: left;
}
.next span { font-size: 0.8125rem; }
.next:hover, .next:active { background: var(--ink); color: var(--page); }

/* footer */
.foot { padding-block: 28px 32px; color: var(--light); font-size: 0.75rem; display: grid; gap: 10px; text-align: center; }
.foot p { margin: 0; }
details { text-align: left; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 10px 0; }
summary { cursor: pointer; text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.6875rem; color: var(--mid); }
details p { margin-top: 8px; }

.status { padding-block: 48px; text-align: center; color: var(--mid); }
.status .next { justify-content: center; margin-top: 20px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="brandrow">
      <button class="wordmark" id="home" type="button" aria-label="Apricity, back to all menus">APRICITY</button>
      <span class="table caps" data-table></span>
    </div>
    <nav class="tabs" role="tablist" aria-label="Menus">
      <div class="group">
        <button class="tab" role="tab" data-view="drinks" type="button">Drinks</button>
        <button class="tab" role="tab" data-view="wine" type="button">Wine</button>
      </div>
      <span class="divider" aria-hidden="true"></span>
      <div class="group">
        <button class="tab" role="tab" data-view="alacarte" type="button">A la carte</button>
        <button class="tab" role="tab" data-view="tasting" type="button">Tasting</button>
      </div>
    </nav>
    <div class="chips" id="chips" aria-label="Jump to section"></div>
  </div>
</header>

<section class="splash wrap" id="splash" hidden>
  <div>
    <h1>APRICITY</h1>
    <span class="table caps" data-table></span>
  </div>
  <nav class="links" aria-label="Menus">
    <button type="button" data-view="drinks">Drinks</button>
    <button type="button" data-view="wine">Wine list</button>
    <button type="button" data-view="alacarte">A la carte</button>
    <button type="button" data-view="tasting">Tasting menus</button>
  </nav>
  <p class="note">Allergies? Please tell your server before ordering.</p>
</section>

<main class="wrap" id="body"></main>
<footer class="wrap foot" id="foot"></footer>

<script>
(function () {
  // ---------- where the menus come from ----------
  // Each menu is one tab of a Google Sheet. In Google Sheets: File → Share → Publish to web,
  // choose the tab and "Comma-separated values (.csv)", then paste the link here.
  var SHEETS = {
    drinks: "sheets/drinks.csv",
    alacarte: "sheets/alacarte.csv",
    tasting: "sheets/tasting.csv",
    tastingPrices: "sheets/tasting-prices.csv",
    wine: "sheets/wine.csv"
  };
  var NEEDS = { drinks: ["drinks"], wine: ["wine"], alacarte: ["alacarte"], tasting: ["tasting", "tastingPrices"] };

  var KEY = "V Vegetarian · P-B Plant-Based · C Crustaceans · Ce Celery · D Dairy · E Eggs · F Fish · P Peanuts · G Gluten · L Lupin · N Nuts · Mo Molluscs · Mu Mustard · S Soya · SD Sulphur Dioxide · Se Sesame · A Alcohol";
  var TRACES = "We prepare our food in an environment with allergens and can’t guarantee that a dish is completely free of any allergen as traces may remain.";
  var ALLERGENS = "<details><summary>Allergen key</summary><p>" + KEY + "</p><p>" + TRACES + "</p></details>";
  var FOOT = "<p>A discretionary 13.5% ‘Apriciation’ goes to the whole team. 50p per person supports School Food Matters.</p>";
  var ALLERGY_NOTE = '<p class="note">Allergies? Please tell your server before ordering.</p>';

  // ---------- loading the sheets ----------
  function parseCSV(text) {
    var rows = [], row = [], cell = "", q = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += ch;
      } else if (ch === '"') q = true;
      else if (ch === ",") { row.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); rows.push(row); row = []; cell = "";
      } else cell += ch;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }
  // Rows become objects keyed by the lower-case column heading. Blank rows and rows with Show = "no" are left out.
  function toRows(text) {
    var all = parseCSV(text.replace(/^﻿/, ""));
    var head = (all.shift() || []).map(function (h) { return h.trim().toLowerCase(); });
    return all.map(function (r) {
      var o = {};
      head.forEach(function (h, i) { o[h] = (r[i] || "").trim(); });
      return o;
    }).filter(function (o) {
      var filled = Object.keys(o).some(function (k) { return k !== "show" && o[k]; });
      return filled && !/^(no|n|hide|hidden|false)$/i.test(o.show || "");
    });
  }
  var cache = {};
  function load(key) {
    if (!cache[key]) {
      cache[key] = fetch(SHEETS[key], { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.text();
      }).then(toRows).catch(function (e) { delete cache[key]; throw e; });
    }
    return cache[key];
  }
  function groupBy(rows, key) {
    var out = [], idx = {};
    rows.forEach(function (r) {
      var k = r[key] || "Other";
      if (!(k in idx)) { idx[k] = out.length; out.push({ title: k, rows: [] }); }
      out[idx[k]].rows.push(r);
    });
    return out;
  }

  // ---------- state ----------
  var VIEWS = ["home", "drinks", "wine", "alacarte", "tasting"];
  var state = { view: "home", plantOnly: false, courses: 5 };
  try { state.plantOnly = !!JSON.parse(localStorage.getItem("apricity-menu") || "{}").plantOnly; } catch (e) {}

  var $ = function (s) { return document.querySelector(s); };
  var chips = $("#chips"), body = $("#body"), foot = $("#foot"), top = $(".top"), splash = $("#splash");

  // The table QR code opens ...?table=12
  var tbl = (location.search.match(/table=(\d+)/) || [])[1];
  document.querySelectorAll("[data-table]").forEach(function (el) { el.textContent = tbl ? "Table " + tbl : ""; });

  // ---------- building blocks ----------
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "s"; }
  function money(v) { return /^\d+(\.\d+)?$/.test(v) ? "£" + v : v; }
  function codes(c) {
    return c ? ' <span class="codes">' + c.split(/\s*,\s*/).map(function (x) { return x === "P-B" ? "<b>P-B</b>" : esc(x); }).join(", ") + "</span>" : "";
  }
  function isPB(r) { return /\bP-B\b/.test((r.allergens || "") + " " + (r.description || "")); }
  function plantFilter(rows) { return rows.filter(function (r) { return !state.plantOnly || isPB(r); }); }
  function item(name, allergens, price, priceNote, desc) {
    return '<li class="item"><span class="name">' + esc(name) + codes(allergens) + '</span><span class="price">' + esc(money(price || "")) +
      (priceNote ? "<small>" + esc(priceNote) + "</small>" : "") + "</span>" + (desc ? '<p class="desc">' + esc(desc) + "</p>" : "") + "</li>";
  }
  function rowItem(r) { return item(r.item || r.dish, r.allergens, r.price, r["price note"], r.description); }
  function wine(w) {
    var unique = w.unique && !/^(no|n)$/i.test(w.unique);
    return '<li class="item"><span class="name">' + (unique ? "♢ " : "") + '<span class="vin">' + esc(w.vintage) + "</span> " + esc(w.producer) +
      (w["cuvée"] || w.cuvee ? ' <span class="cuv">/ ' + esc(w["cuvée"] || w.cuvee) + "</span>" : "") + '</span><span class="price">' + esc(money(w.price)) +
      (w["glass price"] ? "<small>" + esc(w["glass price"]) + "</small>" : "") + '</span><p class="desc">' +
      esc([w.grapes, w.region].filter(Boolean).join(" · ")) + "</p></li>";
  }
  function section(id, title, inner, note) {
    return '<section class="section" id="sec-' + id + '" data-sec="' + id + '"><h2 class="caps">' + esc(title) +
      (note ? "<small>" + esc(note) + "</small>" : "") + "</h2>" + inner + "</section>";
  }
  function list(items) { return '<ul class="items">' + items.join("") + "</ul>"; }
  function next(view, label, hint) {
    return '<button class="next" type="button" data-view="' + view + '"><span class="caps">' + label + "</span><span>" + hint + " →</span></button>";
  }
  function setChips(nav, filter) {
    chips.innerHTML = (filter ? '<button class="chip" type="button" id="plant" aria-pressed="' + state.plantOnly + '">Plant-based</button><span class="sep" aria-hidden="true"></span>' : "") +
      nav.map(function (s) { return '<button class="chip" type="button" data-jump="' + s[0] + '">' + esc(s[1]) + "</button>"; }).join("");
  }
  // A plain menu tab (drinks, a la carte): Section | Item | Description | Allergens | Price | Price note | Section note | Show
  function simpleMenu(rows, food) {
    var groups = groupBy(rows, "section");
    var html = groups.map(function (g) {
      var shown = food ? plantFilter(g.rows) : g.rows;
      var note = (g.rows.filter(function (r) { return r["section note"]; })[0] || {})["section note"];
      return section(slug(g.title), g.title, shown.length ? list(shown.map(rowItem)) : '<p class="empty">No plant-based ' + esc(g.title.toLowerCase()) + " today.</p>", note);
    }).join("");
    setChips(groups.map(function (g) { return [slug(g.title), g.title]; }), food);
    return html;
  }

  // ---------- views ----------
  var render = {
    drinks: function (d) {
      body.innerHTML = simpleMenu(d.drinks) + next("alacarte", "Food menu", "A la carte & tasting");
      foot.innerHTML = FOOT;
    },
    wine: function (d) {
      var html = '<p class="note">♢ Wines with unique expressions</p>', nav = [];
      groupBy(d.wine, "serve").forEach(function (serve) {
        var sections = groupBy(serve.rows, "section");
        if (/glass/i.test(serve.title)) {
          nav.push(["glass", "By the glass"]);
          html += section("glass", "By the glass", sections.map(function (s) {
            return '<h3 class="caps">' + esc(s.title) + "</h3>" + list(s.rows.map(wine));
          }).join(""), "125ml");
        } else {
          html += '<h2 class="caps group-title">Bottles</h2>';
          sections.forEach(function (s, i) {
            var id = "b-" + slug(s.title);
            nav.push([id, s.title.replace(/^(White|Red)\s*[—–-]\s*/, "$1: ").replace(/^Orange\s*\/.*/, "Orange")]);
            html += section(id, s.title, list(s.rows.map(wine)), i === 0 ? "750ml" : "");
          });
        }
      });
      body.innerHTML = html + next("alacarte", "Food menu", "A la carte & tasting");
      setChips(nav);
      foot.innerHTML = FOOT;
    },
    alacarte: function (d) {
      body.innerHTML = ALLERGY_NOTE + simpleMenu(d.alacarte, true) + next("drinks", "Drinks", "Cocktails, wine & more");
      foot.innerHTML = ALLERGENS + FOOT;
    },
    // Tasting tab: Course | Dish | Allergens | Supplement | Courses (Both / 7 only) | Add to 5-course | Description | Price | Show
    // Prices tab: Menu | Price | Lunch & early evening | Wine pairing | Alcohol-free pairing | Pairing glasses
    tasting: function (d) {
      var menus = d.tastingPrices.map(function (r) { return { n: parseInt(r.menu, 10), r: r }; }).filter(function (m) { return m.n; });
      if (!menus.some(function (m) { return m.n === state.courses; }) && menus.length) state.courses = menus[0].n;
      var sel = (menus.filter(function (m) { return m.n === state.courses; })[0] || { r: {} }).r;

      var html = '<div class="seg" role="group" aria-label="Number of courses">' + menus.map(function (m) {
        return '<button type="button" data-courses="' + m.n + '" aria-pressed="' + (state.courses === m.n) + '"><span class="caps">' + m.n +
          ' courses</span><span class="big">' + esc(money(m.r.price)) + "</span>" +
          (m.r["lunch & early evening"] ? "<small>Lunch &amp; early evening " + esc(money(m.r["lunch & early evening"])) + "*</small>" : "") + "</button>";
      }).join("") + '</div><p class="note">*Lunch &amp; pre-booked early dinner, groups up to 6. Choose one dish per course.</p>';

      var groups = groupBy(d.tasting, "course"), courses = "", extras = [];
      groups.forEach(function (g) {
        if (g.rows.some(function (r) { return r.price; })) { extras.push(g); return; }
        var only7 = g.rows.some(function (r) { return /7/.test(r.courses || "") && !/both|5/i.test(r.courses); });
        if (only7 && state.courses !== 7) {
          var add = (g.rows.filter(function (r) { return r["add to 5-course"]; })[0] || {})["add to 5-course"];
          if (add) courses += '<h3 class="caps">' + esc(g.title) + " · add " + esc(money(add)) + "</h3>";
          return;
        }
        // A course with one dish (the pre dessert) is served to everyone, so the plant-based filter leaves it alone.
        courses += '<h3 class="caps">' + esc(g.title) + '</h3><ul class="opts">' + (g.rows.length > 1 ? plantFilter(g.rows) : g.rows).map(function (r) {
          return "<li>" + esc(r.dish) + codes(r.allergens) + (r.supplement ? ' <span class="codes">+' + esc(money(r.supplement)) + "</span>" : "") + "</li>";
        }).join("") + "</ul>";
      });
      html += section("courses", state.courses + "-course menu", courses);
      if (sel["wine pairing"] || sel["alcohol-free pairing"]) {
        html += section("pairings", "Pairings", list([item("Wine", "", sel["wine pairing"]), item("Alcohol-free", "", sel["alcohol-free pairing"])]),
          sel["pairing glasses"] ? sel["pairing glasses"].replace(/^(\d+)$/, "$1 glasses") : "");
      }
      extras.forEach(function (g) { html += section(slug(g.title), g.title, list(plantFilter(g.rows).map(rowItem))); });

      body.innerHTML = ALLERGY_NOTE + html + next("drinks", "Drinks", "Cocktails, wine & more");
      setChips([["courses", "Courses"], ["pairings", "Pairings"]].concat(extras.map(function (g) { return [slug(g.title), g.title.replace(/^Add on the side$/i, "Sides")]; })), true);
      foot.innerHTML = ALLERGENS + FOOT;
    }
  };

  function show(view, push) {
    if (VIEWS.indexOf(view) < 0) view = "home";
    state.view = view;
    var home = view === "home";
    splash.hidden = !home; top.hidden = home; body.hidden = home; foot.hidden = home;
    if (push) { try { history.pushState(null, "", home ? location.pathname + location.search : "#" + view); } catch (e) {} }
    window.scrollTo(0, 0);
    if (home) { Object.keys(SHEETS).forEach(function (k) { load(k).catch(function () {}); }); return Promise.resolve(); }

    document.querySelectorAll(".tab").forEach(function (b) { b.setAttribute("aria-selected", b.dataset.view === view); });
    chips.innerHTML = ""; foot.innerHTML = "";
    var keys = NEEDS[view], pending = setTimeout(function () { body.innerHTML = '<p class="status">Loading menu…</p>'; }, 150);
    return Promise.all(keys.map(load)).then(function (res) {
      clearTimeout(pending);
      if (state.view !== view) return;
      var d = {}; keys.forEach(function (k, i) { d[k] = res[i]; });
      render[view](d);
      spy();
    }, function () {
      clearTimeout(pending);
      if (state.view !== view) return;
      body.innerHTML = '<div class="status"><p>The menu didn’t load. Check your connection, or ask your server.</p><button class="next" type="button" data-retry>Try again</button></div>';
    });
  }
  function rerender() { var y = window.scrollY; show(state.view).then(function () { window.scrollTo(0, y); }); }

  // ---------- section scroll-spy ----------
  var observer;
  function spy() {
    if (observer) observer.disconnect();
    if (!("IntersectionObserver" in window)) return;
    observer = new IntersectionObserver(function (entries) {
      if (jumping) return;
      entries.forEach(function (e) { if (e.isIntersecting) setActive(e.target.dataset.sec); });
    }, { rootMargin: "-35% 0px -60% 0px" });
    body.querySelectorAll("[data-sec]").forEach(function (s) { observer.observe(s); });
    var first = body.querySelector("[data-sec]");
    if (first) setActive(first.dataset.sec);
  }
  // Moves the chip row instantly: a second smooth scroll running alongside the page's can cancel it on some phones.
  function setActive(id) {
    chips.querySelectorAll("[data-jump]").forEach(function (c) {
      var on = c.dataset.jump === id;
      c.classList.toggle("active", on);
      if (!on) return;
      var cr = c.getBoundingClientRect(), r = chips.getBoundingClientRect();
      if (cr.left < r.left || cr.right > r.right) chips.scrollLeft += cr.left - r.left - 8;
    });
  }

  // ---------- jumping to a section ----------
  var jumping = null, jumpTimer;
  function jump(id) {
    var s = document.getElementById("sec-" + id);
    if (!s) return;
    jumping = id;
    setActive(id);
    var start = s.getBoundingClientRect().top, distance = start - top.offsetHeight + 1;
    var smooth = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    window.scrollTo({ top: Math.max(0, window.pageYOffset + distance), behavior: smooth ? "smooth" : "auto" });
    // Where the window itself doesn't scroll (some embedded viewers), scroll whatever contains the page instead.
    setTimeout(function () {
      if (Math.abs(distance) > 2 && Math.abs(s.getBoundingClientRect().top - start) < 2) s.scrollIntoView({ block: "start" });
    }, 150);
    clearTimeout(jumpTimer);
    jumpTimer = setTimeout(function () { jumping = null; }, 1000);
  }

  // ---------- events ----------
  document.addEventListener("click", function (e) {
    var t = e.target.closest("button");
    if (!t) return;
    if (t.id === "home") return show("home", true);
    if (t.hasAttribute("data-retry")) return show(state.view);
    if (t.dataset.view) { if (t.dataset.view !== state.view) show(t.dataset.view, true); else window.scrollTo({ top: 0, behavior: "smooth" }); return; }
    if (t.dataset.jump) return jump(t.dataset.jump);
    if (t.id === "plant") {
      state.plantOnly = !state.plantOnly;
      try { localStorage.setItem("apricity-menu", JSON.stringify({ plantOnly: state.plantOnly })); } catch (err) {}
      return rerender();
    }
    if (t.dataset.courses) { state.courses = +t.dataset.courses; return rerender(); }
  });
  window.addEventListener("popstate", function () { show(location.hash.slice(1)); });

  show(location.hash.slice(1));
})();
</script>
