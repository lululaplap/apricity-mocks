<style>
/* Layout: apricityrestaurant.com's mobile look. A teal band carries the peach APRICITY wordmark; menus sit in one centred column on peach; a teal footer closes each page. */
:root {
  --page: #F9C6BA;          /* site background peach */
  --band: #034852;          /* site header/footer teal */
  --on-band: #F9C6BA;
  --ink: #000000;
  --mid: #3A3A3A;
  --light: #5F5A59;
  --rule: rgba(0, 0, 0, 0.15);
  --rule-strong: rgba(0, 0, 0, 0.5);
  --accent: #034852;
  --sel-bg: #034852;
  --sel-fg: #F9C6BA;
  --font: "Josefin Sans", "Brandon Grotesque", "Futura", "Century Gothic", sans-serif;
  --step--2: 0.6875rem;
  --step--1: 0.8125rem;
  --step-0: 1rem;
  --step-1: 1.125rem;
  --step-2: 1.5rem;
  --step-3: 2rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #032F36; --band: #021F24; --on-band: #F9C6BA; --ink: #FBE6DF; --mid: #E3C4BA; --light: #B39C96;
    --rule: rgba(249, 198, 186, 0.16); --rule-strong: rgba(249, 198, 186, 0.45);
    --accent: #F9C6BA; --sel-bg: #F9C6BA; --sel-fg: #032F36;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #032F36; --band: #021F24; --on-band: #F9C6BA; --ink: #FBE6DF; --mid: #E3C4BA; --light: #B39C96;
  --rule: rgba(249, 198, 186, 0.16); --rule-strong: rgba(249, 198, 186, 0.45);
  --accent: #F9C6BA; --sel-bg: #F9C6BA; --sel-fg: #032F36;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--page);
  color: var(--ink);
  font-family: var(--font);
  font-weight: 300;
  font-size: var(--step-0);
  line-height: 1.6;
  letter-spacing: 0.03em;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band);
}
button { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.caps { text-transform: uppercase; letter-spacing: 0.2em; font-weight: 400; }

/* ---------- sticky top ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--page); }
.band { background: var(--band); color: var(--on-band); }
.brandrow {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding-block: 14px 12px;
}
.wordmark {
  grid-column: 2; background: none; border: 0; padding: 0; cursor: pointer;
  font-family: var(--font); font-weight: 300; font-size: 2rem; line-height: 1;
  letter-spacing: 0.16em; margin-right: -0.16em; color: var(--on-band);
}
.table-chip {
  grid-column: 3; justify-self: end; font-size: var(--step--2); white-space: nowrap; opacity: 0.85;
}
.tabs { display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; padding-block: 14px 10px; }
.tab {
  border: 0; background: transparent; padding: 4px 2px; cursor: pointer;
  font-size: var(--step--1); color: var(--mid); letter-spacing: 0.08em; text-transform: uppercase;
  text-underline-offset: 4px;
}
.tab[aria-selected="true"] { color: var(--ink); text-decoration: underline; text-decoration-thickness: 1px; font-weight: 600; }

.chips {
  display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
  padding-block: 2px 12px; border-bottom: 1px solid var(--rule-strong);
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--rule-strong); background: transparent; border-radius: 999px;
  padding: 6px 12px 4px; font-size: var(--step--2); cursor: pointer; color: var(--mid);
  white-space: nowrap; text-transform: uppercase; letter-spacing: 0.14em;
}
.chip.active { background: var(--ink); border-color: var(--ink); color: var(--page); }
.chip.filter[aria-pressed="true"] { background: var(--sel-bg); border-color: var(--sel-bg); color: var(--sel-fg); }
.chips .sep { flex: none; width: 1px; background: var(--rule-strong); margin: 3px 2px; }

/* ---------- welcome ---------- */
.welcome { padding-block: 0 40px; display: grid; gap: 28px; text-align: center; }
.hero { margin-inline: calc(-1 * max(20px, env(safe-area-inset-left, 0px))); aspect-ratio: 4 / 3; overflow: hidden; background: var(--band); }
.hero img { width: 100%; height: 100%; object-fit: cover; display: block; animation: settle 1.6s ease-out both; }
@keyframes settle { from { transform: scale(1.04); } to { transform: none; } }
.welcome h1 { font-size: var(--step-3); letter-spacing: 0.25em; margin: 8px 0 14px; margin-right: -0.25em; }
.lede { color: var(--mid); margin: 0 auto; max-width: 34ch; font-size: 0.9375rem; line-height: 1.8; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice {
  border: 1px solid var(--rule-strong); background: transparent; cursor: pointer;
  padding: 22px 8px 18px; display: grid; gap: 6px; justify-items: center; align-content: center;
  transition: background .2s, color .2s;
}
.choice:hover, .choice:active { background: var(--sel-bg); color: var(--sel-fg); border-color: var(--sel-bg); }
.choice:hover .sub, .choice:active .sub { color: var(--sel-fg); }
.choice .name { font-size: var(--step--1); }
.choice .sub { font-size: var(--step--1); color: var(--mid); line-height: 1.35; }
.allergy {
  font-size: 0.9375rem; color: var(--mid); margin: 0; padding-block: 16px;
  border-top: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule-strong);
}
.allergy strong { color: var(--ink); font-weight: 600; }

/* ---------- menu ---------- */
.menu { padding-block: 0 8px; }
.page-head { text-align: center; padding-top: 34px; }
.page-head h1 { font-size: var(--step-2); letter-spacing: 0.25em; margin: 0 -0.25em 0 0; }
.intro { color: var(--mid); font-size: 0.875rem; line-height: 1.8; margin: 14px auto 0; max-width: 36ch; text-align: center; }
.section { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 170px); padding-top: 30px; }
.section > h2 {
  font-size: var(--step--1); margin: 0; padding-bottom: 8px; border-bottom: 1px solid var(--rule-strong);
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
}
.section > h2 small { font-size: var(--step--2); color: var(--light); letter-spacing: 0.14em; }
.items { list-style: none; margin: 0; padding: 0; }
.item {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 20px;
  padding: 12px 0; border-bottom: 1px solid var(--rule);
}
.item:last-child { border-bottom: 0; }
.item .title { min-width: 0; font-weight: 400; }
.codes { font-size: var(--step--2); color: var(--light); letter-spacing: 0.08em; white-space: nowrap; font-weight: 400; }
.codes .pb { color: var(--accent); font-weight: 600; }
.item .desc { grid-column: 1; color: var(--mid); font-size: 0.875rem; margin: 0; }
.price {
  grid-column: 2; grid-row: 1 / span 2; align-self: start;
  font-variant-numeric: tabular-nums lining-nums; white-space: nowrap; text-align: right; font-weight: 400;
}
.price .alt { display: block; color: var(--light); font-size: var(--step--2); letter-spacing: 0.06em; font-weight: 300; }
.empty { color: var(--mid); padding: 12px 0; margin: 0; font-size: 0.9375rem; }
.prose { color: var(--mid); font-size: 0.875rem; margin: 10px 0 0; line-height: 1.7; }

/* wine rows (as on the website: vintage, producer / cuvée, then grapes and region) */
.wine .title .vin { color: var(--mid); font-weight: 300; }
.wine .title .cuv { color: var(--mid); font-weight: 300; }
.wine .title .uniq { color: var(--accent); margin-right: 4px; }
.wine .meta { grid-column: 1; display: flex; flex-wrap: wrap; gap: 0 14px; font-size: var(--step--1); color: var(--light); }

/* switches (tasting menus, glass/bottle) */
.seg { display: grid; grid-template-columns: 1fr 1fr; margin: 24px 0 0; border: 1px solid var(--rule-strong); }
.seg button { border: 0; background: transparent; padding: 14px 6px 12px; cursor: pointer; display: grid; gap: 2px; }
.seg button + button { border-left: 1px solid var(--rule-strong); }
.seg .n { font-size: var(--step--1); }
.seg .p { font-size: var(--step-2); font-variant-numeric: lining-nums; }
.seg .s { font-size: var(--step--1); color: var(--mid); }
.seg button[aria-pressed="true"] { background: var(--sel-bg); color: var(--sel-fg); }
.seg button[aria-pressed="true"] .s { color: var(--sel-fg); }
.fine { color: var(--mid); font-size: 0.8125rem; margin: 10px 0 0; text-align: center; }
.course { padding-top: 22px; }
.course h3 { font-size: var(--step--2); margin: 0; color: var(--mid); }
.course .hint { color: var(--accent); font-weight: 600; }
.opts { list-style: none; margin: 4px 0 0; padding: 0; }
.opt { padding: 8px 0; font-weight: 400; }
.opt + .opt::before { content: "or"; display: block; color: var(--light); font-size: var(--step--1); margin: -2px 0 6px; font-weight: 300; }
.supp { display: block; color: var(--mid); font-size: 0.875rem; font-weight: 300; }

/* footer band */
.foot { margin-top: 44px; padding-block: 30px 34px; display: grid; gap: 18px; font-size: 0.8125rem; line-height: 1.7; }
.foot p { margin: 0; opacity: 0.9; }
.foot h3 { margin: 0 0 4px; font-size: var(--step--1); color: var(--on-band); }
.foot .star { text-align: center; font-size: var(--step--1); letter-spacing: 0.1em; padding-top: 6px; border-top: 1px solid rgba(249, 198, 186, 0.3); }
.foot .mock { text-align: center; font-size: var(--step--2); opacity: 0.65; letter-spacing: 0.12em; text-transform: uppercase; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>

<main>

    </div>
    <div class="choices">
      <button class="choice" type="button" data-go="alacarte"><span class="name caps">A la carte</span><span class="sub">Starters, mains, sides &amp; puddings</span></button>
      <button class="choice" type="button" data-go="tasting"><span class="name caps">Tasting menus</span><span class="sub">5 or 7 courses, from £85</span></button>

      <button class="choice" type="button" data-go="wine"><span class="name caps">Wine list</span><span class="sub">Low intervention growers</span></button>
    </div>
    <p class="allergy"><strong>Any allergies?</strong> Please let your server know before ordering. Allergens are listed beside every dish.</p>
  </section>

  <section class="menu wrap" id="menu" hidden>
    <div id="menu-body"></div>
  </section>
</main>

<footer class="band">
  <div class="wrap foot" id="foot"></div>
</footer>

  }
  function jumpChips(list) {
    return list.map(function (s) { return '<button class="chip" type="button" data-jump="' + s.id + '">' + esc(s.title) + "</button>"; }).join("");
  }
  function footer(food) {
    foot.innerHTML =
      (food ? '<div><h3 class="caps">Allergens</h3><p>' + esc(KEY) + "</p></div><p>" + esc(TRACES) + "</p>" : "") +
      '<div><h3 class="caps">Apriciation</h3><p>' + esc(APRICIATION) + "</p></div><p>" + esc(SFM) + "</p>" +
      '<p class="star">Michelin Green Star</p><p class="mock">Design mockup · content from apricityrestaurant.com, 25 Oct 2026</p>';
  }

  // ---------- render ----------
  function renderList(key) {
    var m = MENUS[key], html = head(m.title, m.intro);
    m.sections.forEach(function (s) {
      var items = s.items.filter(function (i) { return !(m.food && state.plantOnly) || isPB(i); });
      html += '<section class="section" id="sec-' + s.id + '" data-sec="' + s.id + '"><h2 class="caps">' + esc(s.title) +
        (s.note ? '<small class="caps">' + esc(s.note) + "</small>" : "") + "</h2>" +
        (s.prose ? '<p class="prose">' + esc(s.prose) + "</p>" : "") + '<ul class="items">';
      if (!items.length) html += '<li class="empty">No plant-based ' + esc(s.title.toLowerCase()) + " on today’s menu. Please ask your server.</li>";
      items.forEach(function (i) { html += itemHTML(i); });
      html += "</ul>" + (s.after ? '<p class="prose">' + esc(s.after) + "</p>" : "") + "</section>";
    });
    body.innerHTML = html;
    chips.innerHTML = (m.food ? filterChip("plant-filter", "Plant-based only", state.plantOnly) : "") + jumpChips(m.sections);
    chips.hidden = false;
    footer(m.food);
    spy();
  }

  function renderTasting() {
    var sel = TASTING.menus[state.courses];
    var html = head("Tasting menus", TASTING.intro) + '<div class="seg" role="group" aria-label="Choose a tasting menu">';
    [5, 7].forEach(function (n) {
      var t = TASTING.menus[n];
      html += '<button type="button" data-courses="' + n + '" aria-pressed="' + (state.courses === n) + '"><span class="n caps">' + n +
        '-course</span><span class="p">' + t.price + '</span><span class="s">Lunch &amp; early evening ' + t.special + "*</span></button>";
    });
    html += '</div><p class="fine">*Valid for lunch &amp; pre-booked early dinner reservations, for groups of up to 6 guests</p>';

    html += '<section class="section" id="sec-courses" data-sec="courses"><h2 class="caps">Choose one dish per course<small class="caps">' + state.courses + " courses</small></h2>";
    TASTING.courses.forEach(function (c) {
      if (c.only7 && state.courses !== 7) {
        if (c.add5) html += '<div class="course"><h3 class="caps">' + esc(c.t) + ' · <span class="hint">Add for ' + c.add5 + "</span></h3></div>";
        return;
      }
      html += '<div class="course"><h3 class="caps">' + esc(c.t) + "</h3>";
      if (c.fixed) { html += '<p class="prose">' + esc(c.fixed) + "</p></div>"; return; }
      var opts = c.o.filter(function (o) { return !state.plantOnly || isPB(o); });
      html += '<ul class="opts">' + opts.map(function (o) {
        return '<li class="opt">' + esc(o.n) + codes(o.c) + (o.s ? '<span class="supp">' + esc(o.s) + "</span>" : "") + "</li>";
      }).join("") + "</ul></div>";
    });
    html += "</section>";

    html += '<section class="section" id="sec-pairings" data-sec="pairings"><h2 class="caps">Pairings<small class="caps">' + sel.glasses + '</small></h2><ul class="items">' +
      itemHTML({ n: "Wine pairing", p: sel.wine }) + itemHTML({ n: "Non-alcoholic pairing", d: "Curated by Michal, our resident drinks expert", p: sel.na }) + "</ul></section>";

    html += '<section class="section" id="sec-extras" data-sec="extras"><h2 class="caps">Add on the side</h2><ul class="items">' +
      [BREAD].concat(TASTING.sides).filter(function (i) { return !state.plantOnly || isPB(i); }).map(itemHTML).join("") + "</ul></section>";

    body.innerHTML = html;
    chips.innerHTML = filterChip("plant-filter", "Plant-based only", state.plantOnly) +
      jumpChips([{ id: "courses", title: "Courses" }, { id: "pairings", title: "Pairings" }, { id: "extras", title: "Sides" }]);
    chips.hidden = false;
    footer(true);
    spy();
  }

  function renderWine() {
    var labels = [["By the glass", "125ml"], ["Bottles", "750ml"]];
    var html = head("Wine list", WINE.intro, '<p class="fine">♢ Wines with unique expressions</p>') +
      '<div class="seg" role="group" aria-label="Glass or bottle">' + WINE.groups.map(function (g, i) {
        var n = g.s.reduce(function (a, s) { return a + s.w.length; }, 0);
        return '<button type="button" data-wine="' + i + '" aria-pressed="' + (state.wineGroup === i) + '"><span class="n caps">' + labels[i][0] +
          '</span><span class="s">' + labels[i][1] + " · " + n + " wines</span></button>";
      }).join("") + "</div>";
    var group = WINE.groups[state.wineGroup], secs = [];
    group.s.forEach(function (s, i) {
      var id = "w" + state.wineGroup + "-" + i, ws = s.w.filter(function (w) { return !state.uniqueOnly || w.u; });
      secs.push({ id: id, title: s.t.replace(/^(White|Red) — /, "$1: ") });
      html += '<section class="section" id="sec-' + id + '" data-sec="' + id + '"><h2 class="caps">' + esc(s.t) + '</h2><ul class="items">' +
        (ws.length ? ws.map(wineHTML).join("") : '<li class="empty">No ♢ wines in this section.</li>') + "</ul></section>";
    });
    body.innerHTML = html;
    chips.innerHTML = filterChip("unique-filter", "♢ Unique only", state.uniqueOnly) + jumpChips(secs);
    chips.hidden = false;
    footer(false);
    spy();
  }

  function show(view, push) {
    if (["alacarte", "tasting", "drinks", "wine"].indexOf(view) < 0) view = "welcome";
    state.view = view;
    var inMenu = view !== "welcome";
    welcome.hidden = inMenu; menu.hidden = !inMenu; nav.hidden = !inMenu;
    document.querySelectorAll(".tab").forEach(function (b) { b.setAttribute("aria-selected", b.dataset.view === view); });
    if (view === "tasting") renderTasting(); else if (view === "wine") renderWine(); else if (inMenu) renderList(view); else footer(false);
    if (push !== false) { try { history.pushState({ v: view }, "", inMenu ? "#" + view : location.pathname + location.search); } catch (e) {} }
    window.scrollTo(0, 0);
  }
  function rerender() {
    var y = window.scrollY;
    show(state.view, false);
    window.scrollTo(0, y);
  }

  // ---------- section scroll-spy ----------
  var observer;
  function spy() {
    if (observer) observer.disconnect();
    if (!("IntersectionObserver" in window)) return;
    observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) setActive(e.target.dataset.sec); });
    }, { rootMargin: "-40% 0px -55% 0px" });
    body.querySelectorAll("[data-sec]").forEach(function (s) { observer.observe(s); });
    var first = body.querySelector("[data-sec]");
    if (first) setActive(first.dataset.sec);
  }
  function setActive(id) {
    chips.querySelectorAll("[data-jump]").forEach(function (c) {
      var on = c.dataset.jump === id;
      c.classList.toggle("active", on);
      if (on && (c.offsetLeft < chips.scrollLeft || c.offsetLeft + c.offsetWidth > chips.scrollLeft + chips.clientWidth)) {
        chips.scrollTo({ left: c.offsetLeft - 20, behavior: "smooth" });
      }
    });
  }

  // ---------- events ----------
  document.addEventListener("click", function (e) {
    var t = e.target.closest("button");
    if (!t) return;
    if (t.id === "home") return show("welcome");
    if (t.dataset.go) return show(t.dataset.go);
    if (t.dataset.view) { if (t.dataset.view !== state.view) show(t.dataset.view); else window.scrollTo({ top: 0, behavior: "smooth" }); return; }
    if (t.dataset.jump) { var s = document.getElementById("sec-" + t.dataset.jump); if (s) s.scrollIntoView({ behavior: "smooth" }); setActive(t.dataset.jump); return; }
    if (t.id === "plant-filter") {
      state.plantOnly = !state.plantOnly;
      try { localStorage.setItem("apricity-menu", JSON.stringify({ plantOnly: state.plantOnly })); } catch (err) {}
      return rerender();
    }
    if (t.id === "unique-filter") { state.uniqueOnly = !state.uniqueOnly; return rerender(); }
    if (t.dataset.courses) { state.courses = +t.dataset.courses; return rerender(); }
    if (t.dataset.wine) { state.wineGroup = +t.dataset.wine; return show("wine", false); }
  });
  window.addEventListener("popstate", function () { show(location.hash.slice(1), false); });

  show(location.hash.slice(1), false);
})();
</script>
